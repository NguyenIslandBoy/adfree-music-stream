name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install yt-dlp with EJS support
        run: pip install -U "yt-dlp[default]" --quiet

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o server ./cmd/server/

      - name: Build Docker image
        run: docker build -t adfree-music-stream .