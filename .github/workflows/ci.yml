name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install yt-dlp
        run: pip install yt-dlp --quiet

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o server ./cmd/server/

      - name: Build Docker image
        run: docker build -t adfree-music-stream .